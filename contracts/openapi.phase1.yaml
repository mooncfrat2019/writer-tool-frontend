openapi: 3.1.0
info:
  title: Writer Tool API
  version: 0.1.0-phase4
  description: |
    Writer Tool contract: auth, projects, book structure, documents,
    characters, worlds, custom fields, search, assets and exports.
    Real-time collaboration, sharing, version history, timelines with
    calendars, and React Flow diagrams are included.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.writertool.app/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Projects
  - name: Books
  - name: Documents
  - name: Characters
  - name: Worlds
  - name: CustomFields
  - name: Search
  - name: Assets
  - name: Exports
  - name: Sharing

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      responses:
        '200':
          description: New access token issued and refresh token rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Projects available to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Projects]
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectMembers
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/invitations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: inviteProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /projects/{projectId}/books:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Books]
      operationId: listBooks
      responses:
        '200':
          description: Books in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Books]
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Books]
      operationId: getBook
      responses:
        '200':
          description: Book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Books]
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /books/{bookId}/cover:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Books]
      operationId: setBookCover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCoverRequest'
      responses:
        '200':
          description: Book with the cover attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Books]
      operationId: clearBookCover
      responses:
        '200':
          description: Book with the cover removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{bookId}/tree:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Books]
      operationId: getBookTree
      responses:
        '200':
          description: Nested book structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookTree'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{bookId}/nodes:
    parameters:
      - $ref: '#/components/parameters/BookId'
    post:
      tags: [Books]
      operationId: createBookNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookNodeCreate'
      responses:
        '201':
          description: Node created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookNode'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    patch:
      tags: [Books]
      operationId: updateBookNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookNodeUpdate'
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookNode'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Books]
      operationId: deleteBookNode
      parameters:
        - name: strategy
          in: query
          schema:
            type: string
            enum: [reject_if_children, cascade]
            default: reject_if_children
      responses:
        '204':
          description: Node deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /nodes/{nodeId}/move:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [Books]
      operationId: moveBookNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookNodeMove'
      responses:
        '200':
          description: Moved node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookNode'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocument
      responses:
        '200':
          description: Document metadata and canonical snapshot metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    put:
      tags: [Documents]
      operationId: saveDocumentContent
      description: |
        Temporary Phase 1 save endpoint. Replaced by the collaborative Yjs
        protocol in Phase 2. The server validates canonical ProseMirror JSON,
        computes word count and bumps the document version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentContentUpdate'
      responses:
        '200':
          description: Saved document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /documents/{documentId}/collab-token:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      operationId: createCollabToken
      description: |
        Issues a short-lived, document-scoped token for the collaboration
        WebSocket. The token is passed as the `token` query parameter when
        connecting to `websocketPath`.
      responses:
        '200':
          description: Collaboration token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/access:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: getDocumentAccess
      description: Lightweight access probe used while the collaboration editor is open.
      responses:
        '200':
          description: Current effective document access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAccessInfo'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/canonical:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    put:
      tags: [Documents]
      operationId: saveDocumentCanonical
      description: |
        Phase 2 projection endpoint. The collaborative client sends a debounced
        canonical ProseMirror JSON snapshot so exports, search and word/author
        sheet counts stay current. The Yjs state remains the source of truth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCanonicalUpdate'
      responses:
        '200':
          description: Saved projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /documents/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      operationId: listDocumentVersions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Canonical document snapshots, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Documents]
      operationId: createDocumentVersion
      description: Creates a manual snapshot of the current canonical document.
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /documents/{documentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Documents]
      operationId: getDocumentVersion
      responses:
        '200':
          description: Version metadata and canonical content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/versions/{versionId}/restore:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Documents]
      operationId: restoreDocumentVersion
      description: |
        Restores a canonical snapshot. Active collaboration peers are
        disconnected; clients reload and receive the restored Yjs state.
      responses:
        '200':
          description: Restored document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/characters:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Characters]
      operationId: listCharacters
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/CharacterRole'
      responses:
        '200':
          description: Characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Characters]
      operationId: createCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterCreate'
      responses:
        '201':
          description: Character created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /characters/{characterId}:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      operationId: getCharacter
      responses:
        '200':
          description: Character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Characters]
      operationId: updateCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterUpdate'
      responses:
        '200':
          description: Updated character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Characters]
      operationId: deleteCharacter
      responses:
        '204':
          description: Character deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /characters/{characterId}/relations:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      operationId: listCharacterRelations
      responses:
        '200':
          description: Relations of the character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterRelationList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Characters]
      operationId: createCharacterRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterRelationCreate'
      responses:
        '201':
          description: Relation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterRelation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /characters/{characterId}/attachments:
    parameters:
      - $ref: '#/components/parameters/CharacterId'
    get:
      tags: [Characters]
      operationId: listCharacterAttachments
      responses:
        '200':
          description: Illustrations attached to the character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Characters]
      operationId: attachCharacterAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreate'
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /character-relations/{relationId}:
    parameters:
      - $ref: '#/components/parameters/RelationId'
    patch:
      tags: [Characters]
      operationId: updateCharacterRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterRelationUpdate'
      responses:
        '200':
          description: Updated relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterRelation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Characters]
      operationId: deleteCharacterRelation
      responses:
        '204':
          description: Relation deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    patch:
      tags: [Characters]
      operationId: updateAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUpdate'
      responses:
        '200':
          description: Updated attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Characters]
      operationId: deleteAttachment
      responses:
        '204':
          description: Attachment deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/worlds:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Worlds]
      operationId: listWorlds
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Worlds of the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Worlds]
      operationId: createWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldCreate'
      responses:
        '201':
          description: World created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /worlds/{worldId}:
    parameters:
      - $ref: '#/components/parameters/WorldId'
    get:
      tags: [Worlds]
      operationId: getWorld
      responses:
        '200':
