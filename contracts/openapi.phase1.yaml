            format: uuid
        - name: factionId
          in: query
          schema:
            type: string
            format: uuid
        - name: bookId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
        - name: fromValue
          in: query
          schema:
            type: number
            format: double
        - name: toValue
          in: query
          schema:
            type: number
            format: double
        - name: importanceMin
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 5
      responses:
        '200':
          description: Timeline events with lanes and calendars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}/timeline-events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Timeline]
      operationId: createTimelineEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventCreate'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /timeline-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Timeline]
      operationId: getTimelineEvent
      responses:
        '200':
          description: Timeline event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Timeline]
      operationId: updateTimelineEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventUpdate'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Timeline]
      operationId: deleteTimelineEvent
      responses:
        '204':
          description: Event deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /timeline-events/{eventId}/links:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Timeline]
      operationId: addTimelineEventLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineEventLinkCreate'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEventLink'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /timeline-events/{eventId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/LinkId'
    delete:
      tags: [Timeline]
      operationId: removeTimelineEventLink
      responses:
        '204':
          description: Link removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/diagrams:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Diagrams]
      operationId: listDiagrams
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Diagrams of the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagramList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Diagrams]
      operationId: createDiagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramCreate'
      responses:
        '201':
          description: Diagram created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /diagrams/{diagramId}:
    parameters:
      - $ref: '#/components/parameters/DiagramId'
    get:
      tags: [Diagrams]
      operationId: getDiagram
      responses:
        '200':
          description: Diagram with canonical React Flow JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Diagrams]
      operationId: updateDiagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramUpdate'
      responses:
        '200':
          description: Updated diagram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Diagrams]
      operationId: deleteDiagram
      responses:
        '204':
          description: Diagram deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /diagrams/{diagramId}/collab-token:
    parameters:
      - $ref: '#/components/parameters/DiagramId'
    post:
      tags: [Diagrams]
      operationId: createDiagramCollabToken
      responses:
        '200':
          description: Short-lived collaboration token for the diagram room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /diagrams/{diagramId}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/DiagramId'
    post:
      tags: [Diagrams]
      operationId: setDiagramThumbnail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramThumbnail'
      responses:
        '200':
          description: Diagram with the new thumbnail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagram'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterId:
      name: characterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorldId:
      name: worldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorldRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FactionId:
      name: factionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LoreEntryId:
      name: loreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomFieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationId:
      name: relationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 16
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CalendarId:
      name: calendarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiagramId:
      name: diagramId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict (duplicate, stale version or invalid state)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: File or payload is too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          examples: [validation_failed]
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [user, accessToken, accessTokenExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time

    User:
      type: object
      required: [id, email, displayName, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      required: [id, title, role, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        genre:
          type: string
        language:
          type: string
        role:
          $ref: '#/components/schemas/ProjectRole'
        membersCount:
          type: integer
        booksCount:
          type: integer
        wordCount:
          type: integer
        coverUrl:
          type: [string, 'null']
          format: uri
        updatedAt:
          type: string
          format: date-time
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [createdAt, version]
          properties:
            settings:
              type: object
              additionalProperties: true
            createdAt:
              type: string
              format: date-time
            version:
              type: integer
              format: int64
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        nextCursor:
          type: [string, 'null']
    ProjectCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        genre:
          type: string
          maxLength: 100
        language:
          type: string
          maxLength: 20
          default: ru
    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        genre:
          type: string
          maxLength: 100
        language:
          type: string
          maxLength: 20
        version:
          type: integer
          format: int64

    ProjectRole:
      type: string
      enum: [owner, editor, viewer]
    ProjectMember:
      type: object
      required: [userId, displayName, email, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: [string, 'null']
          format: uri
        role:
          $ref: '#/components/schemas/ProjectRole'
        joinedAt:
          type: string
          format: date-time
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
    InvitationCreate:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [editor, viewer]
    Invitation:
      type: object
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [editor, viewer]
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Book:
      type: object
      required: [id, projectId, title, status, seriesOrder, wordCount, characterCount, authorSheets, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
        seriesOrder:
          type: integer
        status:
          $ref: '#/components/schemas/BookStatus'
        synopsis:
          type: string
        coverUrl:
          type: [string, 'null']
          format: uri
        targetWordCount:
          type: integer
        wordCount:
          type: integer
        characterCount:
          type: integer
          description: Unicode characters including spaces, aggregated across all book documents
        authorSheets:
          type: number
          format: double
          description: characterCount divided by 40000 (author sheets, АЛ)
        language:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    BookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    BookCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          type: string
          maxLength: 200
        seriesOrder:
          type: integer
          minimum: 0
        synopsis:
          type: string
          maxLength: 20000
        targetWordCount:
          type: integer
          minimum: 0
    BookUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          type: string
          maxLength: 200
        seriesOrder:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/BookStatus'
        synopsis:
          type: string
          maxLength: 20000
        targetWordCount:
          type: integer
          minimum: 0
        version:
          type: integer
          format: int64

    BookCoverRequest:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
          format: uuid

    BookStatus:
      type: string
      enum: [planning, drafting, revising, final, published]
    BookNodeType:
      type: string
      enum: [part, chapter, scene]
    BookNodeStatus:
      type: string
      enum: [idea, outline, draft, revised, final]
    BookNode:
      type: object
      required: [id, bookId, type, title, status, sortKey, wordCount, characterCount, authorSheets, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        type:
          $ref: '#/components/schemas/BookNodeType'
        title:
          type: string
        synopsis:
          type: string
        notes:
          type: string
        status:
          $ref: '#/components/schemas/BookNodeStatus'
        sortKey:
          type: string
        targetWordCount:
          type: integer
        povCharacterId:
          type: [string, 'null']
          format: uuid
        documentId:
          type: [string, 'null']
          format: uuid
        wordCount:
          type: integer
        characterCount:
          type: integer
          description: Unicode characters including spaces, aggregated across this node and its descendants
        authorSheets:
          type: number
          format: double
          description: characterCount divided by 40000 (author sheets, АЛ)
        children:
          type: array
          items:
            $ref: '#/components/schemas/BookNode'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    BookTree:
      type: object
      required: [book, nodes]
      properties:
        book:
          $ref: '#/components/schemas/Book'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/BookNode'
    BookNodeCreate:
      type: object
      required: [type, title]
      properties:
        type:
          $ref: '#/components/schemas/BookNodeType'
        title:
          type: string
          minLength: 1
          maxLength: 200
        parentId:
          type: [string, 'null']
          format: uuid
        afterId:
          type: [string, 'null']
          format: uuid
        synopsis:
          type: string
          maxLength: 20000
        notes:
          type: string
          maxLength: 50000
        targetWordCount:
          type: integer
          minimum: 0
        povCharacterId:
          type: [string, 'null']
          format: uuid
    BookNodeUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        synopsis:
          type: string
          maxLength: 20000
        notes:
          type: string
          maxLength: 50000
        status:
          $ref: '#/components/schemas/BookNodeStatus'
        targetWordCount:
          type: integer
          minimum: 0
        povCharacterId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          format: int64
    BookNodeMove:
      type: object
      required: [parentId]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        beforeId:
          type: [string, 'null']
          format: uuid
        afterId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          format: int64

    Document:
      type: object
      required: [id, projectId, kind, title, wordCount, characterCount, authorSheets, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, diagram]
        title:
          type: string
        wordCount:
          type: integer
        characterCount:
          type: integer
          description: Unicode characters including spaces
        authorSheets:
          type: number
          format: double
          description: characterCount divided by 40000 (author sheets, АЛ)
        version:
          type: integer
          format: int64
        snapshotAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
        canonical:
          type: [object, 'null']
          additionalProperties: true
          description: Latest canonical ProseMirror JSON (text) or React Flow JSON (diagram)

    DocumentContentUpdate:
      type: object
      required: [canonical, version]
      properties:
        canonical:
          type: object
          additionalProperties: true
          description: ProseMirror JSON document
        version:
          type: integer
          format: int64

    DocumentCanonicalUpdate:
      type: object
      required: [canonical]
      properties:
        canonical:
          type: object
          additionalProperties: true
          description: ProseMirror JSON projection from the collaborative client

    CollabToken:
      type: object
      required: [token, expiresAt, websocketPath, collabAvailable, generation]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        websocketPath:
          type: string
          examples: ['/collab/0192...']
        generation:
          type: integer
          format: int64
          description: Incremented on version restore; stale clients must reload
        collabAvailable:
          type: boolean
          description: |
            False for legacy documents that have canonical content but no Yjs
            state yet. Such documents stay on the Phase 1 REST editor until a
            server-side migration seeds their Yjs document.
        reason:
          type: string
          description: Machine-readable reason when collabAvailable is false

    CharacterRole:
      type: string
      enum: [protagonist, antagonist, deuteragonist, supporting, minor, other]
    CharacterStatus:
      type: string
      enum: [alive, dead, missing, unknown]
