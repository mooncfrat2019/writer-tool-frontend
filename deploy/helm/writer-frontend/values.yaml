replicaCount: 1

image:
  repository: writer-frontend
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: timeweb-registry

nameOverride: ""
fullnameOverride: ""

# Same-origin proxy targets. The backend Service listens on its ADDR port.
apiUpstream: http://writer-backend:8087
collabUpstream: http://writer-backend:8087

service:
  type: LoadBalancer
  port: 8088
  # The cluster has no cloud load-balancer controller; existing services use
  # externalIPs on the node instead.
  externalIPs:
    - 192.168.0.77
  annotations: {}
  # Optional ports list used by values-prod.yaml for HTTP and HTTPS on the
  # Timeweb load balancer. When empty, the chart renders the single
  # service.port entry above.
  ports: []
  externalTrafficPolicy: ""
  loadBalancerSourceRanges: []

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources: {}

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30
